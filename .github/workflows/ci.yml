# CI gate — runs on every push and pull request.
# Lint + build must pass before a branch can be merged.
# Keeps the security posture tight: a broken build can never reach production.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege: read-only on contents, no secrets by default.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint + Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
